version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '07:00'
      timezone: 'Europe/Amsterdam'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    ignore:
      - dependency-name: '@move4mobile*'
      # Angular majors are coupled to Nx: @nx/angular@24 peers cap the
      # Angular toolchain < 23.0.0. Hold major bumps until Nx supports them
      # (run via nx migrate, not standalone). Minor/patch still flow.
      - dependency-name: '@angular*'
        update-types:
          - 'version-update:semver-major'
      # Angular 22 peers TypeScript >=6.0 <6.1, so TypeScript moves with Angular.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
    groups:
      production-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '07:00'
      timezone: 'Europe/Amsterdam'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
